<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>જય મેલડી માઁ - દિવાળી શુભકામનાઓ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Sans Gujarati', sans-serif;
    background: linear-gradient(135deg, #350505, #8b1010, #330505);
    color: #fff4d5;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 850px;
    text-align: center;
    padding: 40px 20px;
    border: 3px solid #ffd66b;
    border-radius: 25px;
    background: rgba(50, 0, 0, 0.75);
    box-shadow: 0 0 40px #ffb52e;
    overflow: hidden;
    position: relative;
}

.top {
    color: #ffd66b;
    font-size: 22px;
    margin-bottom: 20px;
}

.mataji-photo {
    width: 260px;
    max-width: 80%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 20px #ffc04b);
    animation: glow 3s infinite alternate;
}

h1 {
    color: #ffdb75;
    font-size: 35px;
    line-height: 1.7;
    margin-top: 20px;
    text-shadow: 0 0 15px orange;
}

h2 {
    font-size: 27px;
    color: white;
    margin: 15px 0;
}

p {
    font-size: 19px;
    line-height: 2;
    margin-top: 20px;
}

.highlight {
    color: #ffdb75;
    font-weight: bold;
}

.diyas {
    font-size: 45px;
    margin: 25px;
    animation: glow 2s infinite alternate;
}

/* Bottom Background Image */

.bottom-background {
    width: calc(100% + 40px);
    min-height: 350px;
    margin: 30px -20px -40px;

    background-image: url("mataji2.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    
    filter: drop-shadow(0 0 20px gold);
}

.bottom-background {
    display: block;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.3s ease;
}

.bottom-background:hover {
    transform: scale(1.03);
}

.footer {
    margin-top: 25px;
    color: #ffd66b;
    font-size: 22px;
    font-weight: bold;
}

@keyframes glow {
    from {
        filter: drop-shadow(0 0 5px gold);
        transform: scale(1);
    }

    to {
        filter: drop-shadow(0 0 22px orange);
        transform: scale(1.04);
    }
}

@media(max-width:600px) {

    .container {
        padding: 12px;
    }

    .card {
        padding: 30px 15px;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 21px;
    }

    p {
        font-size: 16px;
    }

    .bottom-background {
        min-height: 280px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="top">
🪔 શુભ દીપાવલી 🪔
</div>

<!-- Top Mataji Photo -->

<img src="mataji.png"
class="mataji-photo"
alt="માઁ મેલડી માતાજી">

<h1>
રાજમાન રાજેશ્વરી<br>
શ્રી દયાળી મેલડી માઁ
</h1>

<h2>
દિવાળીની હાર્દિક શુભકામનાઓ
</h2>

<p>
માઁ મેલડીના આશીર્વાદથી તમારા જીવનમાં<br>

<span class="highlight">
સુખ, શાંતિ, સમૃદ્ધિ અને ખુશીઓનો પ્રકાશ
</span>

<br>
હંમેશાં ઝળહળતો રહે.
</p>

<div class="diyas">
🪔 ✨ 🪔
</div>

<h2>
આપ સૌને દિવાળીની ખૂબ ખૂબ શુભકામનાઓ!
</h2>

<div class="footer">
જય મેલડી માઁ 🙏
</div>

<!-- Bottom Background Image -->

<a href="YOUR_GOOGLE_MAPS_LINK"
   target="_blank"
   class="bottom-background"
   title="Location જોવા માટે અહીં ક્લિક કરો">

</a>

</div>
</div>

</body>
</html>
